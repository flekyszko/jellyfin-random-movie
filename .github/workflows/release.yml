name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Resolve version
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "pkg=${VER}.0" >> "$GITHUB_OUTPUT"
          echo "pkg_dir=RandomMovie_${VER}.0" >> "$GITHUB_OUTPUT"
          echo "zip=RandomMovie-${VER}.0.zip" >> "$GITHUB_OUTPUT"

      - name: Create plugin package
        shell: bash
        run: |
          set -e
          BUILD_DIR="src/Jellyfin.Plugin.RandomMovie/bin/Release/net9.0"
          PKG_DIR="${{ steps.version.outputs.pkg_dir }}"
          mkdir -p "$PKG_DIR"
          cp "$BUILD_DIR/Jellyfin.Plugin.RandomMovie.dll" "$PKG_DIR/"
          cp meta.json "$PKG_DIR/"
          cp src/Jellyfin.Plugin.RandomMovie/runtimeconfig.json "$PKG_DIR/"
          zip -r "${{ steps.version.outputs.zip }}" "$PKG_DIR"

      - name: Compute checksums
        id: checksum
        shell: bash
        run: |
          echo "md5=$(md5sum '${{ steps.version.outputs.zip }}' | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum '${{ steps.version.outputs.zip }}' | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Update manifest.json
        shell: bash
        run: |
          set -e
          THE_VERSION="${{ steps.version.outputs.pkg }}"
          THE_ABI="10.11.11.0"
          THE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${{ steps.version.outputs.zip }}"
          TS=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cat > manifest.json <<EOF
          [
            {
              "guid": "1F9B27A8-2C4E-4D6A-9C45-3A0A6B6F9C1B",
              "name": "Random Movie",
              "overview": "A random movie picker for the Jellyfin web UI. Click the dice, pick a genre, a year and a minimum rating, and get a random matching movie from TMDB.",
              "description": "Adds a floating dice button to the Jellyfin web UI. It opens a dialog where you can pick a genre, a year and a minimum rating, and the plugin returns a random matching movie from TMDB (including movies that are not in your library). Supports Hungarian and English UI. The TMDB API key stays on the server.",
              "owner": "${GITHUB_REPOSITORY_OWNER}",
              "category": "General",
              "versions": [
                {
                  "version": "${THE_VERSION}",
                  "changelog": "Fixes plugin settings page registration and adds a more robust web UI injection.",
                  "targetAbi": "10.11.11.0",
                  "sourceUrl": "${THE_URL}",
                  "checksum": "${{ steps.checksum.outputs.md5 }}",
                  "timestamp": "${TS}"
                }
              ]
            }
          ]
          EOF

      - name: Commit manifest back to main
        shell: bash
        run: |
          set -e
          git config user.name "flekyszko"
          git config user.email "flekyszko@users.noreply.github.com"
          git checkout main
          OLD=$(git show main:manifest.json 2>/dev/null | sed -n 's/.*"checksum": *"\([a-f0-9]*\)".*/\1/p' || true)
          NEW=$(sed -n 's/.*"checksum": *"\([a-f0-9]*\)".*/\1/p' manifest.json)
          if [ "$OLD" = "$NEW" ]; then
            echo "Manifest checksum unchanged; skipping commit."
          else
            git add manifest.json
            git commit -m "Publish manifest for ${GITHUB_REF_NAME}"
            git push origin main
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.version.outputs.zip }}
            icon.png
          tag_name: ${{ github.ref_name }}
          body: |
            ## Random Movie ${{ github.ref_name }}

            ### Install (linkes)
            Add this repository URL in *Dashboard → Plugins → Catalog → ⚙️*:
            \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/manifest.json\`
            Then install **Random Movie** from the catalog.

            ### Manual
            1. Download `${{ steps.version.outputs.zip }}`
            2. Extract the folder into your Jellyfin **plugins** directory
            3. Restart Jellyfin, then set your TMDB API key in Dashboard → Plugins → Random Movie

            MD5: `${{ steps.checksum.outputs.md5 }}`  
            SHA256: `${{ steps.checksum.outputs.sha256 }}`