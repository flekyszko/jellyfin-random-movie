<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="utf-8">
    <title>Random Movie</title>
</head>
<body>
    <div id="RandomMovieConfigPage" data-role="page" data-title="Random Movie" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-select">
        <div data-role="content">
            <div class="content-primary">
                <form id="RandomMovieConfigForm">
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="txtApiKey">TMDB API kulcs</label>
                        <input id="txtApiKey" name="TmdbApiKey" type="password" is="emby-input" />
                        <div class="fieldDescription">Ingyenes, a themoviedb.org kód-kulcs itt szerezhető. A plugin ezzel keresi a könyvtáradon kívüli filmeket is.</div>
                    </div>
                    <div class="selectContainer">
                        <label class="selectLabel" for="selLang">UI nyelv</label>
                        <select is="emby-select" id="selLang" name="UiLanguage" class="emby-select-withcolor emby-select">
                            <option value="hu">Magyar</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                    <div class="inputContainer">
                        <label class="inputLabel inputLabelUnfocused" for="numPages">Max véletlen mintaoldalak (1-20)</label>
                        <input id="numPages" name="MaxRandomPages" type="number" is="emby-input" min="1" max="20" />
                        <div class="fieldDescription">A plugin ezt az oldalszámot kéri le a TMDB-ről, hogy széles körből válogasson véletlent.</div>
                    </div>
                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Mentés</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <script type="text/javascript">
            var RandomMovieConfig = {
                pluginUniqueId: '1F9B27A8-2C4E-4D6A-9C45-3A0A6B6F9C1B'
            };

            document.querySelector('#RandomMovieConfigPage')
                .addEventListener('pageshow', function () {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(RandomMovieConfig.pluginUniqueId).then(function (config) {
                        document.querySelector('#txtApiKey').value = config.TmdbApiKey || '';
                        document.querySelector('#selLang').value = config.UiLanguage || 'hu';
                        document.querySelector('#numPages').value = config.MaxRandomPages || 10
                        Dashboard.hideLoadingMsg();
                    });
                });

            document.querySelector('#RandomMovieConfigForm')
                .addEventListener('submit', function (e) {
                    Dashboard.showLoadingMsg();
                    ApiClient.getPluginConfiguration(RandomMovieConfig.pluginUniqueId).then(function (config) {
                        config.TmdbApiKey = document.querySelector('#txtApiKey').value;
                        config.UiLanguage = document.querySelector('#selLang').value;
                        config.MaxRandomPages = parseInt(document.querySelector('#numPages').value, 10) || 5;
                        ApiClient.updatePluginConfiguration(RandomMovieConfig.pluginUniqueId, config).then(function (result) {
                            Dashboard.processPluginConfigurationUpdateResult(result);
                        });
                    });
                    e.preventDefault();
                    return false;
                });
        </script>
    </div>
</body>
</html>
